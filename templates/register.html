
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join LogicVerse | Enter the Unknown</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
            font-family: Arial, sans-serif;
            color: #e2e8f0;
            background:
                radial-gradient(circle at 15% 20%, rgba(91, 33, 182, .25), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(8, 145, 178, .17), transparent 35%),
                #070b19;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(99, 102, 241, .045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, .045) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: linear-gradient(to bottom, black, transparent);
            pointer-events: none;
        }

        .register-container {
            width: 460px;
            max-width: 100%;
            padding: 38px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(129, 140, 248, .25);
            border-radius: 22px;
            background: rgba(15, 23, 42, .82);
            backdrop-filter: blur(18px);
            box-shadow:
                0 0 60px rgba(79, 70, 229, .12),
                0 25px 70px rgba(0, 0, 0, .45);
            animation: appear .8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-label {
            text-align: center;
            color: #818cf8;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #f8fafc;
            margin-bottom: 24px;
        }

        .logo span {
            background: linear-gradient(90deg, #818cf8, #c084fc, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #6366f1, #22d3ee, transparent);
            margin-bottom: 27px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            color: #f8fafc;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            margin: 17px 0 9px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid rgba(100, 116, 139, .35);
            border-radius: 10px;
            outline: none;
            background: rgba(2, 6, 23, .65);
            color: #f1f5f9;
            font-size: 14px;
            transition: .3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        select {
            color: #cbd5e1;
            cursor: pointer;
        }

        select option {
            background: #0f172a;
            color: #f8fafc;
        }

        input:focus, select:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .13);
            background: rgba(15, 23, 42, .95);
        }

        button {
            width: 100%;
            margin-top: 27px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(100deg, #4f46e5, #7c3aed, #0891b2);
            background-size: 200% auto;
            color: white;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: .5px;
            cursor: pointer;
            transition: .35s ease;
            box-shadow: 0 8px 25px rgba(99, 102, 241, .2);
        }

        button:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, .35);
        }

        button:active {
            transform: scale(.98);
        }

        #message {
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 15px;
            color: #cbd5e1;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        .login-link a {
            color: #a5b4fc;
            font-weight: bold;
            text-decoration: none;
            transition: .3s;
        }

        .login-link a:hover {
            color: #67e8f9;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 19px;
            color: #64748b;
            font-size: 12px;
            text-decoration: none;
            transition: .3s;
        }

        .back-link:hover {
            color: #a5b4fc;
        }

        .system-status {
            text-align: center;
            margin-top: 26px;
            color: #64748b;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #34d399;
            border-radius: 50%;
            margin-right: 7px;
            box-shadow: 0 0 9px #34d399;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 14px;
            }

            .register-container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="top-label">THE ALGORITHM NEXUS</div>

        <div class="logo">
            Logic<span>Verse</span>
        </div>

        <div class="divider"></div>

        <h1>Create Your Account</h1>

        <p class="subtitle">
            Every great journey begins with a single step.
            Create your account and enter the unknown.
        </p>

        <form id="registerForm">

            <label class="form-label" for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
            >

            <label class="form-label" for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label class="form-label" for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
            >

            <label class="form-label" for="role">Select Your Role</label>
            <select id="role" required>
                <option value="">Choose your role</option>
                <option value="learner">Learner</option>
                <option value="teacher">Teacher</option>
            </select>

            <button type="submit" id="registerButton">
                Create Account →
            </button>

        </form>

        <p id="message"></p>

        <div class="login-link">
            Already have an account?
            <a href="/login/">Login</a>
        </div>

        <a href="/" class="back-link">← Return to LogicVerse</a>

        <div class="system-status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>

    </div>

    <script src="{% static 'js/register.js' %}"></script>

</body>
</html>
